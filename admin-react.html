<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>买家秀管理后台</title><link rel="stylesheet" href="https://unpkg.com/antd@5.27.4/dist/reset.css"><script src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/antd@5.27.4/dist/antd.min.js"></script><script src="https://unpkg.com/@babel/standalone@7.26.9/babel.min.js"></script><style>body{margin:0;background:#f5f7fa}.brand{font-size:18px;font-weight:600;color:#fff;padding:0 20px;line-height:64px}.content{padding:24px}.exception-img{width:48px;height:48px;object-fit:cover;border-radius:6px}</style></head><body><script>window.onerror=function(m){document.getElementById("root").innerHTML="<main style=\"padding:32px;font-family:Arial\"><h1>后台加载失败</h1><pre>"+m+"</pre></main>"}</script><div id="root"><main style="font-family:Arial,sans-serif;padding:32px"><h1>买家秀管理后台</h1><p>正在加载管理数据…</p><p><a href="/admin/login">重新登录管理员账号</a></p></main></div><script type="text/babel">const {Layout,Menu,Card,Statistic,Row,Col,Table,Button,Image,Drawer,Empty,Space,message}=antd;const {useEffect,useState}=React;const {Sider,Header,Content}=Layout;
async function api(url,options){const r=await fetch(url,{credentials:'same-origin',...options});const d=await r.json();if(!r.ok)throw Error(d.detail||'请求失败');return d}
function Dashboard(){const[tab,setTab]=useState('stats'),[stats,setStats]=useState(null),[exceptions,setExceptions]=useState([]),[detail,setDetail]=useState(null),[loading,setLoading]=useState(false);const loadStats=()=>api('/api/admin/statistics?period=7d').then(setStats).catch(e=>message.error(e.message));const loadExceptions=()=>{setLoading(true);api('/api/admin/exceptions?status=open').then(d=>setExceptions(d.items)).catch(e=>message.error(e.message)).finally(()=>setLoading(false))};useEffect(()=>{loadStats();loadExceptions()},[]);const resolve=async id=>{await api('/api/admin/exceptions/'+id+'/resolve',{method:'POST'});message.success('已标记处理');loadExceptions()};const columns=[{title:'查询时间',dataIndex:'created_at',render:v=>new Date(v).toLocaleString()},{title:'客服',dataIndex:['user','display_name'],render:v=>v||'未知客服'},{title:'客户图片',dataIndex:'query_image_url',render:v=><Image className="exception-img" src={v} preview={{src:v}}/>},{title:'场景标签',dataIndex:'query_scene',render:v=>v?Object.values(v).filter(Boolean).join(' / '):'未识别'},{title:'操作',render:(_,r)=><Space><Button size="small" onClick={()=>api('/api/admin/exceptions/'+r.id).then(setDetail)}>查看</Button><Button size="small" type="primary" onClick={()=>resolve(r.id)}>标记处理</Button></Space>}];return <Layout><Sider><div className="brand">买家秀后台</div><Menu theme="dark" selectedKeys={[tab]} onClick={e=>setTab(e.key)} items={[{key:'stats',label:'客服数据'},{key:'exceptions',label:'异常待处理'},{key:'library',label:'买家秀库'},{key:'accounts',label:'客服子账户'}]}/></Sider><Layout><Header style={{background:'#fff',padding:'0 24px'}}>管理后台</Header><Content className="content">{tab==='stats'&&<><Row gutter={16}><Col span={8}><Card><Statistic title="匹配次数" value={stats?.total_matches||0}/></Card></Col><Col span={8}><Card><Statistic title="成交次数" value={stats?.converted_matches||0}/></Card></Col><Col span={8}><Card><Statistic title="转化率" value={stats?.conversion_rate||0} suffix="%"/></Card></Col></Row><Card title="近 7 天趋势" style={{marginTop:16}}><Table rowKey="date" pagination={false} dataSource={stats?.trend||[]} columns={[{title:'日期',dataIndex:'date'},{title:'匹配次数',dataIndex:'matches'},{title:'成交次数',dataIndex:'conversions'}]}/></Card></>}{tab==='exceptions'&&<Card title="无结果检索" extra={<Button onClick={loadExceptions}>刷新</Button>}><Table rowKey="id" loading={loading} dataSource={exceptions} columns={columns} locale={{emptyText:<Empty description="暂无待处理异常"/>}}/></Card>}{tab==='library'&&<Card title="买家秀库"><Empty description="图库管理页面即将接入"/></Card>}{tab==='accounts'&&<Card title="客服子账户"><Empty description="沿用现有账号配置"/></Card>}<Drawer title="异常匹配详情" open={!!detail} onClose={()=>setDetail(null)} width={560}>{detail&&<><Image width="100%" src={detail.query_image_url}/><p>查询时间：{new Date(detail.created_at).toLocaleString()}</p><p>提示：{detail.payload?.message||'无'}</p><pre style={{whiteSpace:'pre-wrap'}}>{JSON.stringify(detail.payload?.query_scene||{},null,2)}</pre></>}</Drawer></Content></Layout></Layout>};ReactDOM.createRoot(document.getElementById('root')).render(<Dashboard/>);
</script><script>
window.addEventListener('load',function(){var root=document.getElementById('root');if(!root||root.querySelector('.ant-layout'))return;fetch('/api/admin/statistics?period=7d',{credentials:'same-origin'}).then(function(r){return r.json()}).then(function(s){root.innerHTML='<main style="font-family:Arial,sans-serif;padding:32px"><h1>买家秀管理后台</h1><div style="display:flex;gap:16px"><div><b>匹配次数</b><h2>'+ (s.total_matches||0) +'</h2></div><div><b>成交次数</b><h2>'+ (s.converted_matches||0) +'</h2></div><div><b>转化率</b><h2>'+ (s.conversion_rate||0) +'%</h2></div></div><p>React 组件加载异常，当前显示兼容模式。</p><p><a href="/admin/login">重新登录管理员账号</a></p></main>'}).catch(function(){})});
</script></body></html>
